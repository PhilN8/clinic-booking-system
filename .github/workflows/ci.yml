name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration tests skip themselves when this is not set, so a
      # plain "go test ./..." still works on a laptop with no database.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clinic_test?sslmode=disable

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify the module
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        run: go build ./...

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  blueprint:
    name: Validate blueprint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Look for the Render API credentials
        id: creds
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_WORKSPACE_ID" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Render API credentials are not configured; skipping the blueprint validation."
          fi

      - name: Validate render.yaml against the Render API
        # Catches a broken blueprint here rather than at deploy time, where
        # the only symptom is a failed deployment log.
        if: steps.creds.outputs.render == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/blueprints/validate" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -F "ownerId=$RENDER_WORKSPACE_ID" \
            -F "file=@render.yaml" > response.json

          if [ "$(jq -r '.valid' response.json)" != "true" ]; then
            echo "::error::render.yaml did not validate"
            jq -r '.errors[]? | "  \(.path): \(.error) (line \(.line), column \(.column))"' response.json
            exit 1
          fi

          echo "render.yaml is valid."
          echo "Planned actions: $(jq -r '.plan.totalActions // 0' response.json)"
          echo "Services: $(jq -r '(.plan.services // []) | join(", ")' response.json)"
          echo "Databases: $(jq -r '(.plan.databases // []) | join(", ")' response.json)"

  publish:
    name: Publish image
    needs: test
    # Only a push to main publishes. Pull requests run the checks but never
    # touch the live environment.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Look for the Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are not configured; skipping the image push."
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.dockerhub == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        # The deploy itself is Render's job. render.yaml sets
        # autoDeployTrigger: checksPass, so Render waits for this workflow's
        # test job to pass on main and then redeploys. Calling Render's
        # deploy hook from here as well would trigger a second, redundant
        # deploy.
        #
        # This step exists to publish a versioned artefact of the exact
        # commit that was deployed, and to give the option of switching
        # Render to runtime: image later.
        if: steps.creds.outputs.dockerhub == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-booking-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-booking-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
