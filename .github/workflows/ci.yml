name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration tests skip themselves when this is not set, so a
      # plain "go test ./..." still works on a laptop with no database.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clinic_test?sslmode=disable

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify the module
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        run: go build ./...

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: test
    # Only a push to main deploys. Pull requests run the checks but do not
    # touch the live environment.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clinic-booking-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger the Render deploy
        # Render's deploy hook builds and starts the new image. It is stored
        # as a repository secret; the pipeline fails loudly if it is missing.
        run: |
          test -n "${{ secrets.RENDER_DEPLOY_HOOK }}" || {
            echo "RENDER_DEPLOY_HOOK secret is not set" >&2
            exit 1
          }
          curl -fsSL "${{ secrets.RENDER_DEPLOY_HOOK }}"
