# Local development stack.
#
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/clinic?sslmode=disable go run ./cmd/api
#
# The API service is started by the compose file as well, so
# "docker compose up -d" alone is enough to get a running API on :8080.

services:
  postgres:
    image: postgres:18-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18's image moved its data directory to
      # /var/lib/postgresql/18/docker and declares /var/lib/postgresql as
      # the volume. Mounting the parent directory is what actually persists
      # the cluster; mounting /var/lib/postgresql/data would silently
      # discard it.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: clinic-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/clinic?sslmode=disable
      PORT: "8080"
      CLINIC_TZ: Africa/Nairobi
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
